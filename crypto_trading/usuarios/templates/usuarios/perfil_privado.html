{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Perfil Privado" %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full text-center">
        <div class="w-24 h-24 bg-gray-900 rounded-full flex items-center justify-center mx-auto mb-6 border border-gray-800">
            <svg class="w-10 h-10 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
        </div>

        <h1 class="text-3xl font-bold text-white mb-2">{% trans "Este perfil es privado" %}</h1>
        <p class="text-gray-400 mb-8">
            {% trans "El usuario" %} <span class="text-green-500 font-mono">@{{ usuario.username }}</span> {% trans "ha configurado su perfil como privado para proteger sus estadísticas de trading." %}
        </p>

        <a href="{% url 'landing' %}" class="inline-flex items-center text-gray-400 hover:text-white transition border-b border-transparent hover:border-white pb-0.5">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            {% trans "Volver al inicio" %}
        </a>
    </div>

</body>
</html>
