{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="utf-8">
    <title>{{ titulo }} · CryptoTrade</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen font-sans flex flex-col">

    <nav class="border-b border-gray-800 bg-gray-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="{% url 'landing' %}" class="text-gray-400 hover:text-green-400 transition flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                {% trans "Volver al inicio" %}
            </a>
            {% include "lang_sel.html" %}
        </div>
    </nav>

    <main class="flex-grow max-w-3xl mx-auto px-4 py-16">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl">
            
            <h1 class="text-3xl font-bold text-green-500 mb-8 border-b border-gray-800 pb-4">
                {{ titulo }}
            </h1>

            <div class="prose prose-invert prose-green max-w-none text-gray-300 leading-relaxed">
                {{ contenido|safe }}
                
                <hr class="border-gray-800 my-10">
                
                <div class="text-sm text-gray-500 bg-black/30 p-4 rounded-lg border border-gray-800">
                    <p>{% trans "Última actualización: Noviembre 2025" %}</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-8 text-center text-gray-600 text-sm border-t border-gray-900 bg-black">
        <span>© CryptoTrade 2025</span>
    </footer>

</body>
</html>
