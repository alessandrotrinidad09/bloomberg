{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Correo enviado" %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black min-h-screen flex items-center justify-center p-4">
    {% include "lang_sel.html" %}

    <div class="w-full max-w-md text-center">
        <h1 class="text-3xl font-bold text-green-500 mb-4">{% trans "Revisa tu correo" %}</h1>
        <p class="text-gray-300">
            {% trans "Si existe una cuenta con ese correo, te enviamos un enlace para restablecer tu contraseña." %}
        </p>
        <p class="mt-6">
            <a href="{% url 'login' %}" class="text-green-500 hover:text-green-400">{% trans "Volver al login" %}</a>
        </p>
    </div>
</body>

</html>
