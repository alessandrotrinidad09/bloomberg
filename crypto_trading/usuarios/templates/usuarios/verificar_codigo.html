<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Verificación 2FA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-6 text-white">
  <div class="w-full max-w-md bg-gray-900 p-6 rounded-2xl shadow-xl">
    <h1 class="text-2xl font-bold text-center text-green-500 mb-4">Verificación en dos pasos</h1>
    <p class="text-gray-400 text-center mb-4">
      Se ha enviado un código de 6 dígitos a <strong>{{ email }}</strong>.
    </p>

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <input type="text" name="codigo" placeholder="Ingresa el código" maxlength="6" required
             class="w-full px-4 py-3 bg-black border border-gray-700 rounded-lg text-white focus:border-green-500 outline-none">
      <button type="submit" class="w-full bg-green-500 hover:bg-green-600 py-3 rounded-lg font-bold">
        Verificar
      </button>
    </form>

    {% if messages %}
    <div class="mt-4 text-center text-red-400">
      {% for message in messages %}
      <p>{{ message }}</p>
      {% endfor %}
    </div>
    {% endif %}
  </div>
</body>
</html>
