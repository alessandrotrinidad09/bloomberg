{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Crear nueva contraseña" %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black min-h-screen flex items-center justify-center p-4">
    {% include "lang_sel.html" %}
    <div class="w-full max-w-md">
        <h1 class="text-3xl font-bold text-green-500 mb-6 text-center">{% trans "Crear nueva contraseña" %}</h1>

        {% if validlink %}
        <form method="post" class="space-y-4">
            {% csrf_token %}

            <!-- Errores del formulario (si los hay) -->
            {{ form.non_field_errors }}
            {% for field in form %}
            {% for error in field.errors %}
            <p class="text-red-400 text-sm">{{ error }}</p>
            {% endfor %}
            {% endfor %}

            <!-- Campo: nueva contraseña -->
            <div>
                <label for="id_new_password1" class="block text-gray-300 mb-2">
                    {% trans "Contraseña nueva" %}
                </label>
                <input id="id_new_password1" name="new_password1" type="password" required autocomplete="new-password"
                    minlength="8" class="w-full px-4 py-3 bg-black border border-gray-700 rounded-lg text-white
                  focus:outline-none focus:border-green-500 transition">
            </div>

            <!-- Campo: confirmar contraseña -->
            <div>
                <label for="id_new_password2" class="block text-gray-300 mb-2">
                    {% trans "Contraseña nueva (confirmación)" %}
                </label>
                <input id="id_new_password2" name="new_password2" type="password" required autocomplete="new-password"
                    minlength="8" class="w-full px-4 py-3 bg-black border border-gray-700 rounded-lg text-white
                  focus:outline-none focus:border-green-500 transition">
            </div>

            <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg">
                {% trans "Guardar contraseña" %}
            </button>
        </form>

        {% endif %}
    </div>
</body>

</html>
