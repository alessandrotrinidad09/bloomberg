{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Restablecer contraseña" %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <h1 class="text-3xl font-bold text-green-500 mb-6 text-center">
            {% trans "Restablecer contraseña" %}
        </h1>

        <p class="text-gray-300 mb-4 text-center">
            {% trans "Ingresa tu correo y te enviaremos un enlace para crear una nueva contraseña." %}
        </p>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.email.errors }}
            <input type="email" name="email" required placeholder="{% trans 'ejemplo@correo.com' %}" class="w-full px-4 py-3 bg-black border border-gray-700 rounded-lg text-white
                    focus:outline-none focus:border-green-500 transition">
            <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg">
                {% trans "Enviar enlace" %}
            </button>
        </form>

        <p class="text-center text-gray-400 mt-6">
            <a href="{% url 'login' %}" class="text-green-500 hover:text-green-400">
                {% trans "Volver a iniciar sesión" %}
            </a>
        </p>
    </div>
</body>

</html>
