<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloombergFG - Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white min-h-screen flex">

        <!-- Sidebar -->
    {% include 'partials/sidebar.html' %}

    <!-- Contenido principal -->
    <main class="flex-1 p-6">
        <h2 class="text-3xl font-bold mb-4">Bienvenido a tu Panel</h2>
        <p class="text-gray-400 mb-6">Aquí verás el resumen de tu portafolio e información principal.</p>

        <div class="grid md:grid-cols-3 gap-6">
            <!-- Tarjeta 1 -->
            <div class="bg-gray-900 p-6 rounded-xl shadow border border-gray-800">
                <h3 class="text-lg font-semibold mb-2">Saldo Total</h3>
                <p class="text-2xl text-green-500 font-bold">$12,340.00</p>
            </div>
            <!-- Tarjeta 2 -->
            <div class="bg-gray-900 p-6 rounded-xl shadow border border-gray-800">
                <h3 class="text-lg font-semibold mb-2">Inversiones Activas</h3>
                <p class="text-2xl text-green-500 font-bold">5</p>
            </div>
            <!-- Tarjeta 3 -->
            <div class="bg-gray-900 p-6 rounded-xl shadow border border-gray-800">
                <h3 class="text-lg font-semibold mb-2">Ganancia Estimada</h3>
                <p class="text-2xl text-green-500 font-bold">+8.4%</p>
            </div>
        </div>
    </main>

</body>

</html>
