<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloombergFG - Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white min-h-screen flex">

    <!-- Sidebar -->
    <aside class="bg-gray-900 w-64 flex flex-col p-4 border-r border-gray-800">
        <!-- Logo -->
        <div class="flex items-center gap-2 mb-8">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-green-500" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M11 11V3h2v8h8v2h-8v8h-2v-8H3v-2h8z" />
            </svg>
            <h1 class="text-2xl font-bold">CryptoTrade</h1>
        </div>

        <!-- Menú -->
        <nav class="flex flex-col space-y-4">
            <a href="#" class="flex items-center gap-3 p-2 rounded-lg hover:bg-green-500 hover:text-white transition">
                <!-- Icono inicio -->
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-400 group-hover:text-white transition"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 12l9-9 9 9M4 10v10h16V10" />
                </svg>
                Inicio
            </a>
            <a href="#" class="flex items-center gap-3 p-2 rounded-lg hover:bg-green-500 hover:text-white transition">
                <!-- Icono monedas -->
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-400 group-hover:text-white transition"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8c-2.21 0-4 1.79-4 4m8 0c0 2.21-1.79 4-4 4m-6 0h12" />
                </svg>
                Monedas disponibles
            </a>
            <a href="#" class="flex items-center gap-3 p-2 rounded-lg hover:bg-green-500 hover:text-white transition">
                <!-- Icono inversiones -->
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-400 group-hover:text-white transition"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 19V6a1 1 0 112 0v13a1 1 0 11-2 0zM5 13l7-7 7 7" />
                </svg>
                Mis inversiones
            </a>
            <a href="#" class="flex items-center gap-3 p-2 rounded-lg hover:bg-green-500 hover:text-white transition">
                <!-- Icono perfil -->
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-400 group-hover:text-white transition"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M5.121 17.804A9 9 0 1118.364 4.561M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                Perfil
            </a>
            <a href="{% url 'logout' %}"
                class="flex items-center gap-3 p-2 mt-auto rounded-lg bg-red-600 hover:bg-red-700 transition">
                <!-- Icono logout -->
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1" />
                </svg>
                Cerrar sesión
            </a>
        </nav>
    </aside>

    <!-- Contenido principal -->
    <main class="flex-1 p-6">
        <h2 class="text-3xl font-bold mb-4">Bienvenido a tu Panel</h2>
        <p class="text-gray-400 mb-6">Aquí verás el resumen de tu portafolio e información principal.</p>

        <div class="grid md:grid-cols-3 gap-6">
            <!-- Tarjeta 1 -->
            <div class="bg-gray-900 p-6 rounded-xl shadow border border-gray-800">
                <h3 class="text-lg font-semibold mb-2">Saldo Total</h3>
                <p class="text-2xl text-green-500 font-bold">$12,340.00</p>
            </div>
            <!-- Tarjeta 2 -->
            <div class="bg-gray-900 p-6 rounded-xl shadow border border-gray-800">
                <h3 class="text-lg font-semibold mb-2">Inversiones Activas</h3>
                <p class="text-2xl text-green-500 font-bold">5</p>
            </div>
            <!-- Tarjeta 3 -->
            <div class="bg-gray-900 p-6 rounded-xl shadow border border-gray-800">
                <h3 class="text-lg font-semibold mb-2">Ganancia Estimada</h3>
                <p class="text-2xl text-green-500 font-bold">+8.4%</p>
            </div>
        </div>
    </main>

</body>

</html>
