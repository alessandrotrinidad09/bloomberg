<style>
    @media (min-width: 768px) {
        main {
            margin-left: 16rem !important; /* 64 de tailwind = 16rem */
            width: calc(100% - 16rem) !important;
        }
    }
</style>

<aside class="bg-gray-900 w-64 flex flex-col p-4 border-r border-gray-800 hidden md:flex h-screen fixed left-0 top-0 z-50">
    <div class="flex items-center gap-2 mb-8 px-2">
        <div class="w-8 h-8 bg-green-500 rounded-lg flex items-center justify-center text-black font-bold text-xl">C</div>
        <h1 class="text-2xl font-bold text-white tracking-tighter">Crypto<span class="text-green-500">Trade</span></h1>
    </div>

    <nav class="flex flex-col flex-grow space-y-2 overflow-y-auto">
        
        <a href="{% url 'inicio' %}" 
           class="flex items-center gap-3 p-3 rounded-lg transition-all duration-200
           {% if request.resolver_match.view_name == 'dashboard:home' %}
               bg-gray-800 text-green-500 font-bold border-l-4 border-green-500
           {% else %}
               text-gray-300 hover:bg-green-500 hover:text-white
           {% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
            <span>Inicio</span>
        </a>

        <a href="{% url 'trading:trade_view' %}" 
           class="flex items-center gap-3 p-3 rounded-lg transition-all duration-200
           {% if 'trading' in request.resolver_match.app_names %}
               bg-gray-800 text-green-500 font-bold border-l-4 border-green-500
           {% else %}
               text-gray-300 hover:bg-green-500 hover:text-white
           {% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
            </svg>
            <span>Operar</span>
        </a>
        
        <a href="{% url 'trading:monedas' %}" class="flex items-center gap-3 p-3 rounded-lg text-gray-300 hover:bg-green-500 hover:text-white transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v.01" /></svg>
            <span>Monedas disponibles</span>
        </a>
        
        <a href="{% url 'trading:portfolio_view' %}" class="flex items-center gap-3 p-3 rounded-lg text-gray-300 hover:bg-green-500 hover:text-white transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
            <span>Mis inversiones</span>
        </a>

        <a href="{% url 'perfil' %}" class="flex items-center gap-3 p-3 rounded-lg text-gray-300 hover:bg-green-500 hover:text-white transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
            <span>Perfil</span>
        </a>
    </nav>
    
    <div class="mt-auto pt-4 border-t border-gray-800">
        <div class="px-2 mb-4">
            <p class="text-xs text-gray-500 uppercase font-bold">Tu Cuenta</p>
            <p class="text-sm text-white font-bold truncate">{{ user.username }}</p>
            <p class="text-xs text-green-500 font-mono">${{ user.balance|floatformat:2 }}</p>
        </div>

        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="w-full flex items-center justify-center gap-2 p-3 rounded-lg bg-red-600/10 text-red-500 hover:bg-red-600 hover:text-white transition border border-red-600/20 hover:border-transparent cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1" /></svg>
                <span class="font-medium">Cerrar sesión</span>
            </button>
        </form>
    </div>
</aside>
